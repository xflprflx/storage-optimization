<!doctype html>
<html lang="{{ get_lang() }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ _("Entrar") }} · Slotta</title>
  <link rel="icon" href="/static/brand/slotta-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/brand/slotta-icon-180.png">
  <meta name="theme-color" content="#0f2a2a">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background: #0f2a2a; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .nk-login { width: 100%; max-width: 380px; border: 0; border-radius: .8rem; box-shadow: 0 12px 40px rgba(0,0,0,.35); }
    .nk-brand { font-weight: 700; font-size: 1.75rem; color: #0f2a2a; letter-spacing: -.01em; }
    .nk-slogan { color: #0f766e; font-size: .9rem; font-weight: 500; margin-top: .15rem; }
    .btn-accent { background: #0f766e; color: #fff; } .btn-accent:hover { background: #115e59; color: #fff; }
  </style>
</head>
<body>
<div class="card nk-login"><div class="card-body p-4">
  <div class="nk-brand d-flex align-items-center gap-2"><img src="/static/brand/slotta-icon.svg" width="40" height="40" alt=""> Slotta</div>
  <div class="nk-slogan mb-3">{{ _("Cada item no lugar certo. Cada passo contado.") }}</div>
  <div class="text-muted small mb-3">{{ _("Entre com o seu usuário para continuar.") }}</div>
  {% if error %}<div class="alert alert-danger py-2 small" role="alert"><i class="bi bi-exclamation-triangle"></i> {{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label class="form-label small mb-0" for="username">{{ _("Usuário") }}</label>
    <input class="form-control mb-2" name="username" id="username" value="{{ username }}" autocomplete="username" autocapitalize="none" required autofocus>
    <label class="form-label small mb-0" for="password">{{ _("Senha") }}</label>
    <input class="form-control mb-3" type="password" name="password" id="password" autocomplete="current-password" required>
    <button class="btn btn-accent w-100"><i class="bi bi-box-arrow-in-right"></i> {{ _("Entrar") }}</button>
  </form>
  <div class="d-flex flex-wrap gap-2 justify-content-center mt-3 small">
    {% for code, lang in LANGUAGES.items() %}<a class="text-decoration-none {{ 'fw-semibold' if code == get_lang() else 'text-muted' }}" lang="{{ code }}" href="/lang/{{ code }}?next={{ ('/login?next=' ~ next)|urlencode }}">{{ lang[0] }}</a>{% endfor %}
  </div>
</div></div>
</body>
</html>
