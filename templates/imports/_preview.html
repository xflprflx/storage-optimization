<div class="card mt-3">
  <div class="card-header bg-white"><strong>Amostra do arquivo</strong> <small class="text-muted">{{ filename }}</small></div>
  <div class="table-responsive">
    <table class="table table-sm table-bordered mb-0 preview-table">
      <thead><tr>{% for h in headers %}<th><span class="text-muted">#{{ loop.index }}</span> {{ h }}</th>{% endfor %}</tr></thead>
      <tbody>
      {% for r in rows %}<tr>{% for c in r %}<td title="{{ c }}">{{ c }}</td>{% endfor %}</tr>{% endfor %}
      </tbody>
    </table>
  </div>
</div>
